# Render Blueprint: the settings for the Render Web Service, kept with the code.
# To use it: Render dashboard -> New -> Blueprint -> pick this repository.
# (A service created by hand works too; these are the same values. See docs/AI-SETUP.md.)
services:
  - type: web
    name: invest-detroit-copilot
    runtime: node
    plan: free                      # sleeps after ~15 idle minutes; "starter" stays awake
    region: oregon
    branch: claude/amazing-heisenberg-brezgi   # switch to development once pull request #2 is merged
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY         # the chatbot's AI key (OpenAI / Codex key)
        sync: false                 # Render asks for the value; it is never stored in this file
      - key: OPENAI_MODEL           # optional: change if the key only allows certain models
        value: gpt-6.1-sol
      - key: ALLOWED_ORIGINS        # websites allowed to call the chat (the add-on on Invest Detroit's site)
        value: https://investdetroit.com,https://www.investdetroit.com
      - key: DATABASE_URL           # keeps insights, ratings and daily limits across restarts
        fromDatabase:
          name: invest-detroit-copilot-db
          property: connectionString
      - key: INSIGHTS_PASSWORD      # password for /insights; Render generates one (see the Environment tab)
        generateValue: true
      - key: ASSISTANT_SALT         # keeps per-visitor daily limits steady across restarts
        generateValue: true

databases:
  - name: invest-detroit-copilot-db
    plan: free                      # Render's free Postgres; check Render's current free-tier terms
